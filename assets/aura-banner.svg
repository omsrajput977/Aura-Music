<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" fill="none">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="nebulaCyan" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaGreen" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#1db954" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#1db954" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaViolet" cx="85%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Accents -->
    <linearGradient id="auraTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <linearGradient id="cyanGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#1db954"/>
    </linearGradient>

    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1db954" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadowBox" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1200" height="380" rx="24" fill="#07080d"/>
  <rect width="1200" height="380" rx="24" fill="url(#nebulaCyan)"/>
  <rect width="1200" height="380" rx="24" fill="url(#nebulaGreen)"/>
  <rect width="1200" height="380" rx="24" fill="url(#nebulaViolet)"/>
  <rect width="1200" height="380" rx="24" stroke="#1e2333" stroke-width="1.5" fill="none"/>

  <!-- Subtle Starfield Dust -->
  <g opacity="0.35">
    <circle cx="120" cy="80" r="1" fill="#ffffff"/>
    <circle cx="280" cy="290" r="1.5" fill="#00f2fe"/>
    <circle cx="450" cy="60" r="1" fill="#ffffff"/>
    <circle cx="780" cy="110" r="1.5" fill="#1db954"/>
    <circle cx="920" cy="310" r="1" fill="#ffffff"/>
    <circle cx="1080" cy="90" r="1.5" fill="#00f2fe"/>
    <circle cx="1120" cy="260" r="1" fill="#ffffff"/>
    <circle cx="180" cy="330" r="1" fill="#8b5cf6"/>
    <circle cx="680" cy="320" r="1" fill="#ffffff"/>
    <circle cx="80" cy="200" r="1.5" fill="#00f2fe"/>
  </g>

  <!-- Top Right 320kbps Pill -->
  <g transform="translate(930, 36)">
    <rect width="230" height="36" rx="18" fill="#0e121d" stroke="#252c42" stroke-width="1"/>
    <circle cx="24" cy="18" r="4" fill="#00f2fe" filter="url(#glowCyan)"/>
    <text x="38" y="22" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="700" letter-spacing="1.5">320KBPS HI-FI ENGINE</text>
  </g>

  <!-- Central Branding Unit (Matches User Crop) -->
  <g transform="translate(180, 115)">
    <!-- Squircle Icon Box -->
    <rect x="0" y="0" width="130" height="130" rx="34" fill="#10131e" stroke="url(#badgeBorder)" stroke-width="1.5" filter="url(#shadowBox)"/>
    
    <!-- Vinyl Disc (Disc3 Icon) -->
    <g transform="translate(65, 65)">
      <!-- Outer Rim Glow -->
      <circle cx="0" cy="0" r="44" fill="#090a10" stroke="#1db954" stroke-width="2.5" filter="url(#glowCyan)" opacity="0.9"/>
      <!-- Concentric Grooves -->
      <circle cx="0" cy="0" r="36" stroke="#1db954" stroke-width="1" stroke-dasharray="8 3" opacity="0.6"/>
      <circle cx="0" cy="0" r="28" stroke="#1db954" stroke-width="1" opacity="0.5"/>
      <circle cx="0" cy="0" r="20" stroke="#1db954" stroke-width="1" stroke-dasharray="6 4" opacity="0.4"/>
      <!-- Center Label Ring -->
      <circle cx="0" cy="0" r="14" fill="#1db954" fill-opacity="0.15" stroke="#00f2fe" stroke-width="1.5"/>
      <!-- Center Hole -->
      <circle cx="0" cy="0" r="5" fill="#07080d" stroke="#00f2fe" stroke-width="1.5"/>
      <!-- Vinyl Grooves Reflection Sheen -->
      <path d="M -30 -30 L 30 30" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.18"/>
    </g>

    <!-- Brand Typography (AURA & SPATIAL VINYL PLAYER) -->
    <g transform="translate(165, 0)">
      <!-- A U R A Title -->
      <text x="0" y="70" fill="url(#auraTextGrad)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Montserrat, sans-serif" font-size="64" font-weight="900" letter-spacing="14">A U R A</text>
      
      <!-- Subtitle (SPATIAL VINYL PLAYER) -->
      <text x="2" y="106" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', 'Courier New', monospace" font-size="16" font-weight="700" letter-spacing="7">SPATIAL VINYL PLAYER</text>
    </g>
  </g>

  <!-- Bottom Visualizer Accent & Features Bar -->
  <g transform="translate(180, 290)">
    <!-- Mini Equalizer Bars -->
    <g transform="translate(0, 8)">
      <rect x="0" y="6" width="3" height="14" rx="1.5" fill="#00f2fe"/>
      <rect x="7" y="0" width="3" height="20" rx="1.5" fill="#10b981"/>
      <rect x="14" y="8" width="3" height="12" rx="1.5" fill="#1db954"/>
      <rect x="21" y="2" width="3" height="18" rx="1.5" fill="#00f2fe"/>
      <rect x="28" y="10" width="3" height="10" rx="1.5" fill="#8b5cf6"/>
      <rect x="35" y="4" width="3" height="16" rx="1.5" fill="#1db954"/>
    </g>

    <!-- Feature Description Tags -->
    <text x="54" y="23" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="12" font-weight="600" letter-spacing="2">DIRECT-DRIVE TURNTABLE  •  ZERO API KEYS  •  320KBPS CD AUDIO STREAMING  •  SPOTIFY BROWSE</text>
  </g>
</svg>